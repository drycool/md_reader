<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Markdown Viewer</title><script src="https://cdn.jsdelivr.net/npm/marked@4.0.10/marked.min.js"></script><link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet"><style>body{font-family:'Segoe UI',sans-serif;background-color:#1e1e1e;color:#d4d4d4;margin:0;padding:0}.container{display:flex;height:100vh}.sidebar{width:300px;background:#2d2d2d;overflow-y:auto;border-right:1px solid #444;padding:20px}.main{flex:1;padding:20px;background:#1e1e1e}.file-input{margin-bottom:20px}.file-input input{margin-right:10px}.loading{display:none;text-align:center;color:#66aaff;font-size:18px}.toc h2{margin-top:0;color:#66aaff}.toc ul{list-style-type:none;padding-left:20px}.toc li{margin:5px 0}.toc a{color:#66aaff;text-decoration:none}.toc a:hover{text-decoration:underline}.content{line-height:1.6}pre{background:#252525;border-radius:4px;padding:10px;overflow-x:auto}code{background:#333;padding:2px 4px;border-radius:2px}@media (max-width:768px){.container{flex-direction:column}.sidebar{width:100%;height:auto;max-height:200px;border-right:none;border-bottom:1px solid #444}.main{padding:10px}.file-input{display:flex;flex-wrap:wrap}.file-input input,.file-input button{margin:5px}}</style></head><body><div class="container"><div class="sidebar"><h2>Documentation</h2><div id="toc"></div></div><div class="main"><div class="file-input"><input type="file" id="fileInput" accept=".md"><button id="loadBtn">Загрузить</button><button id="refreshBtn">Обновить</button></div><div id="loading" class="loading">Загрузка...</div><div id="content"></div></div></div><script>let currentFile=null;function loadFile(file){if(!file.name.endsWith('.md')){alert('Выберите markdown-файл (.md)');return}const loading=document.getElementById('loading');loading.style.display='block';const reader=new FileReader();reader.onload=function(e){let text=e.target.result;if(!text.trim()){document.getElementById('content').innerHTML='<p>Файл пустой.</p>';document.getElementById('toc').innerHTML='';loading.style.display='none';return}text=addIdsToHeadings(text);const toc=generateTOC(text);document.getElementById('toc').innerHTML=toc;document.getElementById('content').innerHTML=marked(text);addTOCClickHandlers();loading.style.display='none'};reader.onerror=function(){document.getElementById('content').innerHTML='<p>Ошибка чтения файла.</p>';loading.style.display='none'};reader.readAsText(file)}fetch('read.md').then(response=>{if(!response.ok)throw new Error('File not found');return response.text()}).then(text=>{currentFile=new File([text],'read.md');loadFile(currentFile)}).catch(()=>{document.getElementById('content').innerHTML='<p>Выберите markdown-файл для просмотра.</p>'});document.getElementById('loadBtn').addEventListener('click',()=>{const fileInput=document.getElementById('fileInput');if(fileInput.files[0]){currentFile=fileInput.files[0];loadFile(currentFile)}});document.getElementById('refreshBtn').addEventListener('click',()=>{if(currentFile){loadFile(currentFile)}else{alert('Нет загруженного файла для обновления.')}});const main=document.querySelector('.main');main.addEventListener('dragover',(e)=>{e.preventDefault();main.style.background='#333'});main.addEventListener('dragleave',()=>{main.style.background='#1e1e1e'});main.addEventListener('drop',(e)=>{e.preventDefault();main.style.background='#1e1e1e';const files=e.dataTransfer.files;if(files[0]&&files[0].name.endsWith('.md')){currentFile=files[0];loadFile(files[0])}});function addIdsToHeadings(md){return md.replace(/^(#{1,6})\s+(.+)$/gm,(match,hashes,title)=>{const id=title.trim().replace(/\s+/g,'-').toLowerCase();return`${hashes} ${title} {#${id}}`})}function addTOCClickHandlers(){const links=document.querySelectorAll('#toc a');links.forEach(link=>{link.addEventListener('click',(e)=>{e.preventDefault();const targetId=link.getAttribute('href').substring(1);const target=document.getElementById(targetId);if(target){target.scrollIntoView({behavior:'smooth'})}})})}function generateTOC(md){const headings=md.match(/^(#{1,6})\s+(.+)$/gm);if(!headings)return'';return'<ul>'+headings.map(h=>{const level=h.split('#').length-1;const title=h.split('#')[level].trim();const id=title.replace(/\s+/g,'-').toLowerCase();return`<li><a href="#${id}">${title}</a></li>`}).join('')+'</ul>'}</script></body></html>
