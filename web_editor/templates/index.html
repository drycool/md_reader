<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Reader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #f8f9fa;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --accent: #4f46e5;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 i {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .file-drop-zone:hover {
            border-color: var(--accent);
            background: rgba(79, 70, 229, 0.05);
        }

        .file-drop-zone i {
            font-size: 32px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .file-drop-zone p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .file-drop-zone span {
            color: var(--accent);
            font-weight: 500;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            width: 100%;
            justify-content: center;
            margin-top: 12px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 16px;
        }

        .tips {
            margin-top: 32px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .tips h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        .tips ul {
            list-style: none;
        }

        .tips li {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tips code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-file-alt"></i> Markdown Reader</h1>
        <p class="subtitle">Просмотр и редактирование Markdown файлов</p>

        <div class="card">
            <div class="card-header">Выберите файл</div>

            <div class="file-input-wrapper">
                <input type="file" class="file-input" id="fileInput" accept=".md,.txt">
                <div class="file-drop-zone">
                    <i class="fas fa-folder-open"></i>
                    <p>Перетащите файл сюда или <span>выберите файл</span></p>
                </div>
            </div>

            <a href="/view?file=" class="btn btn-primary" id="openBlank">
                <i class="fas fa-eye"></i> Открыть пустую страницу
            </a>
        </div>

        <div class="divider"><span>или</span></div>

        <a href="/edit" class="btn btn-secondary">
            <i class="fas fa-plus"></i> Создать новый файл
        </a>

        <div class="tips">
            <h3>Быстрые команды</h3>
            <ul>
                <li><code>python app.py файл.md</code> — открыть файл на просмотр</li>
                <li><code>python app.py файл.md edit</code> — открыть файл на редактирование</li>
            </ul>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                // Используем FileReader для чтения локального файла
                const reader = new FileReader();
                reader.onload = (event) => {
                    // Сохраняем контент и переходим в режим просмотра
                    sessionStorage.setItem('temp_md_content', event.target.result);
                    sessionStorage.setItem('temp_md_name', file.name);
                    window.location.href = '/view?temp=1';
                };
                reader.readAsText(file);
            }
        });

        // Drag and drop
        const dropZone = document.querySelector('.file-drop-zone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--accent)';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border)';

            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.md') || file.name.endsWith('.txt'))) {
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });
    </script>
</body>
</html>
